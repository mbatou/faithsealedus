<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-label="Couple photo placeholder">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#2a2420"/>
      <stop offset="55%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </radialGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1a17"/>
      <stop offset="1" stop-color="#0d0c0b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1100" fill="url(#glow)"/>
  <!-- candle glow -->
  <circle cx="450" cy="360" r="180" fill="#C6A15B" opacity="0.10"/>
  <circle cx="450" cy="360" r="90" fill="#C6A15B" opacity="0.08"/>
  <!-- two silhouettes -->
  <g fill="url(#fig)">
    <path d="M300 780c0-86 42-160 96-160s96 74 96 160z"/>
    <circle cx="396" cy="566" r="58"/>
    <path d="M470 780c0-98 48-182 104-182s104 84 104 182z"/>
    <circle cx="574" cy="544" r="63"/>
  </g>
  <!-- gold hairline detail -->
  <path d="M470 780c0-98 48-182 104-182" fill="none" stroke="#C6A15B" stroke-width="1.5" opacity="0.35"/>
  <g fill="#C6A15B" opacity="0.55" font-family="Georgia, serif" text-anchor="middle">
    <text x="450" y="1000" font-size="30" letter-spacing="2">Add your favourite photo here</text>
    <text x="450" y="1042" font-size="18" opacity="0.7">public/couple-placeholder.svg</text>
  </g>
</svg>
